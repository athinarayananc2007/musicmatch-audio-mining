<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | MusicMatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 72px; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); color: #7c3aed; }
    p { max-width: 420px; color: #94a3b8; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity .2s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="icon">🎵</div>
  <h1>You're Offline</h1>
  <p>MusicMatch needs an internet connection to analyze audio and fetch Spotify recommendations. Please reconnect and try again.</p>
  <a href="/">Go Back Home</a>
</body>
</html>
