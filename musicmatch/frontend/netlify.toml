[build]
  publish = "."

# Netlify Reverse Proxy to Vercel Serverless Backend:
# When you deploy your backend to Vercel, replace the URL below with your live Vercel domain.
# This eliminates CORS issues and lets the frontend make same-origin requests to /api/*.
[[redirects]]
  from = "/api/*"
  to = "https://y-one-eta-46.vercel.app/api/:splat"
  status = 200
  force = true

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
